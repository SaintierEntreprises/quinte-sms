name: Pronostic Quinte du jour

on:
  # Les taches planifiees GitHub arrivent avec des heures de retard (constate : 8 a 9 h).
  # On prepare donc le quinte de DEMAIN des la veille (16h, 18h, 20h, 22h a Paris en hiver) :
  # meme avec 9 h de retard, le fichier est pret avant l'envoi de 8 h.
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quinte
  cancel-in-progress: false

jobs:
  prono:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4==4.12.3

      - id: prono
        run: python quinte.py --out quinte.txt

      - name: Publier quinte.txt
        run: |
          git config user.name "quinte-bot"
          git config user.email "quinte-bot@users.noreply.github.com"
          git add quinte.txt
          git diff --cached --quiet || git commit -m "Pronostic du $(TZ=Europe/Paris date +%d/%m)"
          git push

      - name: Signaler une erreur (e-mail GitHub automatique)
        if: steps.prono.outputs.ok != 'true'
        run: |
          echo "Pronostic introuvable : voir quinte.txt"
          exit 1
